name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cursor/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Assert Build Output API
        run: test -f .vercel/output/config.json
